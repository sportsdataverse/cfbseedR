<svg xmlns="http://www.w3.org/2000/svg" width="518" height="600" viewBox="0 0 518 600">
  <!--
    cfbseedR hex sticker: navy field, gold border, mirrored playoff bracket
    converging on a gold championship diamond.

    Canvas 518x600 matches the SportsDataverse hex family (hexSticker default
    at 300 dpi). The outer hexagon is a regular pointy-top hex, circumradius
    295 centered at (259,300), leaving 5px of bleed at the top/bottom vertices
    and 3.5px at the sides so the gold border renders complete instead of
    being clipped flat at the points.

    Border thickness is 9px at this 518px width (1.7% of width), matching
    wehoop, the thinnest ring in the SportsDataverse family (the others:
    sportsdataverse-R 11px, fastRhockey 17px). It was 18px, the thickest.

    The bracket is a SIXTEEN-slot skeleton - four first-round games per side,
    then quarterfinals, semifinals, and the final - carrying TWELVE filled
    seeds (solid cyan) and FOUR open slots (outlined). That is today's 12-team
    College Football Playoff, where the top four seeds' first-round opponents
    do not exist yet, drawn so the expansion to sixteen is visibly just a
    matter of filling the open slots.

    Geometry: bracket centered on (259,342); team column x=82/436, first-round
    junctions x=116/402, quarterfinal x=152/366, semifinal x=196/322.
    Slot rows 243, 267, 301, 325, 359, 383, 417, 441 (symmetric about 342);
    the open slots are rows 267 and 417 on each side. Every element keeps
    at least 15px of clearance from the navy field edge.
  -->
  <defs>
    <clipPath id="hexclip">
      <polygon points="259,19 502.35,159.5 502.35,440.5 259,581 15.65,440.5 15.65,159.5"/>
    </clipPath>
  </defs>
  <!-- gold border (outer hex, R = 295) -->
  <polygon points="259,5 514.48,152.5 514.48,447.5 259,595 3.52,447.5 3.52,152.5" fill="#FFB612"/>
  <!-- navy field (inner hex, R = 283.45 -> a 9px border, see comment) -->
  <polygon points="259,16.55 504.48,158.275 504.48,441.725 259,583.45 13.52,441.725 13.52,158.275" fill="#0D1B2A"/>
  <g clip-path="url(#hexclip)">
    <!-- wordmark -->
    <text x="259" y="198" font-family="'DejaVu Sans','Segoe UI',Verdana,sans-serif" font-size="76" font-weight="600" fill="#FFFFFF" text-anchor="middle">cfbseedR</text>

    <!-- bracket structure -->
    <g stroke="#41566B" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- LEFT: first round, four games -->
      <path d="M82,243 H116 V267 H82 M116,255 H152"/>
      <path d="M82,301 H116 V325 H82 M116,313 H152"/>
      <path d="M82,359 H116 V383 H82 M116,371 H152"/>
      <path d="M82,417 H116 V441 H82 M116,429 H152"/>
      <!-- LEFT: quarterfinals -->
      <path d="M152,255 V313 M152,284 H196"/>
      <path d="M152,371 V429 M152,400 H196"/>
      <!-- LEFT: semifinal into the title game -->
      <path d="M196,284 V400 M196,342 H241"/>

      <!-- RIGHT: first round, four games (mirrored) -->
      <path d="M436,243 H402 V267 H436 M402,255 H366"/>
      <path d="M436,301 H402 V325 H436 M402,313 H366"/>
      <path d="M436,359 H402 V383 H436 M402,371 H366"/>
      <path d="M436,417 H402 V441 H436 M402,429 H366"/>
      <!-- RIGHT: quarterfinals -->
      <path d="M366,255 V313 M366,284 H322"/>
      <path d="M366,371 V429 M366,400 H322"/>
      <!-- RIGHT: semifinal into the title game -->
      <path d="M322,284 V400 M322,342 H277"/>
    </g>

    <!-- the twelve seeds currently in the field -->
    <g fill="#A9D6E5">
      <circle cx="82" cy="243" r="10"/>
      <circle cx="82" cy="301" r="10"/><circle cx="82" cy="325" r="10"/>
      <circle cx="82" cy="359" r="10"/><circle cx="82" cy="383" r="10"/>
      <circle cx="82" cy="441" r="10"/>
      <circle cx="436" cy="243" r="10"/>
      <circle cx="436" cy="301" r="10"/><circle cx="436" cy="325" r="10"/>
      <circle cx="436" cy="359" r="10"/><circle cx="436" cy="383" r="10"/>
      <circle cx="436" cy="441" r="10"/>
    </g>

    <!-- four open slots: the top seeds' byes today, seats 13-16 tomorrow -->
    <g fill="none" stroke="#A9D6E5" stroke-width="4" stroke-opacity="0.5">
      <circle cx="82" cy="267" r="9"/><circle cx="82" cy="417" r="9"/>
      <circle cx="436" cy="267" r="9"/><circle cx="436" cy="417" r="9"/>
    </g>

    <!-- championship diamond -->
    <polygon points="259,324 277,342 259,360 241,342" fill="#FFB612"/>
  </g>
</svg>
